name: Serato Analyzer

on:
  push:
    paths: ["serato-analyzer/**", ".github/workflows/serato-analyzer.yml"]
  pull_request:
    paths: ["serato-analyzer/**", ".github/workflows/serato-analyzer.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: serato-analyzer

jobs:
  test:
    name: Tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS Apple Silicon, os: macos-15, experimental: false }
          - { name: macOS Intel, os: macos-15-intel, experimental: false }
          - { name: Windows x64, os: windows-latest, experimental: false }
          - { name: Windows ARM64, os: windows-11-arm, experimental: true }
          - { name: Linux (dev), os: ubuntu-latest, experimental: false }
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, os: macos-15 }
          - { arch: x86_64, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build .app and .dmg
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          SKIP_TESTS: "1"
          PYTHON: python
        run: packaging/macos/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SeratoAnalyzer-macos-${{ matrix.arch }}
          path: serato-analyzer/dist/*.dmg

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, os: windows-latest, experimental: false }
          - { arch: arm64, os: windows-11-arm, experimental: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build .exe and installer
        shell: pwsh
        run: ./packaging/windows/build_windows.ps1 -Installer -SkipTests
      - uses: actions/upload-artifact@v4
        with:
          name: SeratoAnalyzer-windows-${{ matrix.arch }}
          path: |
            serato-analyzer/dist/*.zip
            serato-analyzer/dist/*-setup.exe
